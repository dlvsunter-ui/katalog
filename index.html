<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog UTI</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-mint: #d1f1e9; 
      --card-white: #ffffff;
      --text-dark: #1e293b;
      --header-h: 120px; /* Tinggi header disesuaikan */
      --footer-h: 40px;  /* Tinggi footer tipis */
    }

    body {
      margin: 0; padding: 0; 
      background-color: var(--bg-mint);
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-top: var(--header-h); /* Jarak untuk header */
      padding-bottom: calc(var(--footer-h) + 20px); /* Jarak untuk footer */
    }

    /* HEADER TETAP */
    .sticky-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(209, 241, 233, 0.95); 
      backdrop-filter: blur(10px);
      padding: 10px 15px;
      height: var(--header-h);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: flex; flex-direction: column; justify-content: center;
    }

    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .brand-text { font-weight: 800; font-size: 1.3rem; color: #ff0000; letter-spacing: -0.5px;}
    .brand-text span { color: #000000; }
    .header-btns { display: flex; gap: 5px; }

    #searchInput {
      border-radius: 12px; padding: 10px 15px; border: 1px solid #bde6da;
      width: 100%; outline: none; font-size: 13px;
      background: #ffffff; margin-bottom: 8px;
    }

    .filter-section { display: flex; gap: 8px; }
    #categoryDropdown {
      flex: 1; border-radius: 10px; padding: 8px; border: 1px solid #bde6da;
      font-size: 12px; font-weight: 600; color: #334155; background: #fff;
    }
    
    .btn-fav-filter {
      border-radius: 10px; padding: 8px 12px; border: 1px solid #ff4757;
      background: white; color: #ff4757; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    .btn-fav-filter.active { background: #ff4757; color: white; }

    /* KONTEN UTAMA */
    .main-wrapper { 
      background: var(--card-white);
      border-radius: 30px;
      padding: 20px 15px;
      min-height: 70vh;
      margin: 0 10px;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
    }

    /* KARTU PRODUK */
    .product-card {
      background: white; border-radius: 18px; padding: 18px;
      margin-bottom: 15px; border: 1px solid #f1f5f9; 
      box-shadow: 0 8px 15px rgba(0,0,0,0.04);
      position: relative;
    }
    
    .badge-custom {
      font-size: 9px; padding: 5px 12px; border-radius: 8px;
      text-transform: uppercase; font-weight: 700; color: white;
    }
    .merk-label { 
      font-size: 10px; color: #b45309; font-weight: 800; 
      background: #fef3c7; padding: 4px 10px; border-radius: 6px;
    }
    .product-name { 
      font-weight: 700; color: #1e293b; font-size: 14px; 
      margin: 12px 0; line-height: 1.4;
    }

    /* TOMBOL LINK (1 Baris Horizontal) */
    .button-group { display: flex; gap: 10px; flex-wrap: nowrap; }
    .btn-aff {
      flex: 1; border-radius: 12px; padding: 10px; font-size: 11px;
      font-weight: 700; text-align: center; text-decoration: none !important;
      color: white !important; display: flex; align-items: center; justify-content: center; gap: 5px;
      white-space: nowrap;
    }
    .shopee { background: linear-gradient(135deg, #ff7675, #ff4757); }
    .tiktok { background: linear-gradient(135deg, #2d3436, #000000); }

    /* TOMBOL FAVORIT (HEART) */
    .fav-icon {
      font-size: 20px; color: #ccc; cursor: pointer; transition: 0.3s;
    }
    .fav-icon.active { color: #ff4757; }

    /* FOOTER TETAP */
    .sticky-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--footer-h);
      background: #1e293b; color: #f8fafc;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; z-index: 1000;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="sticky-header">
  <div class="header-top">
    <div class="brand-text">Katalog<span>UTI</span></div>
    <div class="header-btns">
      <button class="btn btn-sm btn-warning rounded-pill px-2 text-dark" onclick="installApp()" style="font-size: 9px; font-weight: 800;">
        <i class="fas fa-plus-square"></i> Shortcut
      </button>
      <button class="btn btn-sm btn-outline-danger rounded-pill px-2" onclick="showGuide()" style="font-size: 9px; font-weight: 700;">Panduan</button>
    </div>
  </div>
  
  <input type="text" id="searchInput" placeholder="Ketik nama barang atau merk..." onkeyup="search()">
  
  <div class="filter-section">
    <select id="categoryDropdown" onchange="search()">
      <option value="Semua">📂 Semua Kategori</option>
      <option value="Pakaian & Gaya">👕 Pakaian & Gaya</option>
      <option value="Kesehatan & Perawatan">💖 Kesehatan & Perawatan</option>
      <option value="Perabot & Dekorasi">🏠 Perabot & Dekorasi</option>
      <option value="Gadget & Elektronik">📱 Gadget & Elektronik</option>
      <option value="Kebutuhan Rumah">🛒 Kebutuhan Rumah</option>
      <option value="Ibu & Anak">👶 Ibu & Anak</option>
      <option value="Hobi & Otomotif">🏍️ Hobi & Otomotif</option>
      <option value="Viral & Unik">✨ Viral & Unik</option>
    </select>
    <button class="btn-fav-filter" id="favFilterBtn" onclick="toggleFavFilter()">
      <i class="fas fa-heart"></i> Favorit
    </button>
  </div>
</div>

<!-- KONTEN -->
<div class="main-wrapper">
  <div id="productList">
    <div class="text-center py-5 text-muted small">
       <div class="spinner-border spinner-border-sm text-danger mb-2"></div><br>
       Memuat data...
    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="sticky-footer" id="footerText">
  Sedang memuat info...
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
  let localData = [];
  let showFavOnly = false;
  // Ambil data favorit dari penyimpanan HP
  let favorites = JSON.parse(localStorage.getItem('uti_favorites')) || [];

  // Variabel untuk PWA (Add to home screen)
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9ETE1X3iKPNOXuwVC0LIxjt01bMb_PbJf8P8srgmaFyqS9HyWrFgnLNAehl1wDY4fouEijqOj0Bfz/pub?output=csv';

  function init() {
    Papa.parse(CSV_URL, {
      download: true,
      header: false,
      complete: function(results) {
        // Asumsi data riil dimulai dari baris 2 (indeks 1)
        localData = results.data.slice(1); 
        
        // Ambil teks footer dari Sel G2 (Kolom ke-7 / Indeks 6) dari baris pertama data
        if(localData[0] && localData[0][6]) {
            document.getElementById('footerText').innerText = localData[0][6];
        } else {
            document.getElementById('footerText').innerText = "© 2026 Katalog UTI - Semua Hak Dilindungi.";
        }

        renderData(localData);
      }
    });
  }

  function renderData(data) {
    const list = document.getElementById('productList');
    let html = '';
    
    const validData = data.filter(row => row[0] && row[0].trim() !== "");

    if(validData.length === 0) {
      list.innerHTML = `<div class="text-center py-5 text-muted small">Barang tidak ditemukan.</div>`;
      return;
    }

    validData.forEach((row, index) => {
      const [nama, kategori, merk, shopee, tiktok, kataKunci] = row;
      const isFav = favorites.includes(nama);
      const heartClass = isFav ? 'fas fa-heart active' : 'far fa-heart';
      
      let color = "#94a3b8";
      if(kategori === "Pakaian & Gaya") color = "#f43f5e";
      if(kategori === "Kesehatan & Perawatan") color = "#ec4899";
      if(kategori === "Perabot & Dekorasi") color = "#10b981";
      if(kategori === "Gadget & Elektronik") color = "#3b82f6";
      if(kategori === "Kebutuhan Rumah") color = "#f59e0b";
      if(kategori === "Ibu & Anak") color = "#06b6d4";
      if(kategori === "Hobi & Otomotif") color = "#475569";
      if(kategori === "Viral & Unik") color = "#8b5cf6";

      html += `
        <div class="product-card">
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge-custom" style="background: ${color}">${kategori || 'Lainnya'}</span>
            <div class="d-flex align-items-center gap-2">
              <span class="merk-label">${merk || '-'}</span>
              <i class="${heartClass} fav-icon" onclick="toggleFav('${nama}')"></i>
            </div>
          </div>
          <div class="product-name">${nama}</div>
          <div class="button-group">
            <a href="${shopee}" target="_blank" class="btn-aff shopee"><i class="fas fa-shopping-bag"></i> Shopee</a>
            <a href="${tiktok}" target="_blank" class="btn-aff tiktok"><i class="fab fa-tiktok"></i> TikTok</a>
          </div>
        </div>
      `;
    });
    list.innerHTML = html;
  }

  function search() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('categoryDropdown').value;

    const filtered = localData.filter(row => {
      if(!row[0]) return false;
      const matchSearch = (row[0] + (row[2] || "") + (row[5] || "")).toString().toLowerCase().includes(term);
      const matchCat = (cat === 'Semua' || row[1] === cat);
      const matchFav = !showFavOnly || favorites.includes(row[0]);
      
      return matchSearch && matchCat && matchFav;
    });
    renderData(filtered);
  }

  function toggleFav(namaProduk) {
    if(favorites.includes(namaProduk)) {
      favorites = favorites.filter(item => item !== namaProduk);
    } else {
      favorites.push(namaProduk);
    }
    localStorage.setItem('uti_favorites', JSON.stringify(favorites));
    search(); // Render ulang sesuai state saat ini
  }

  function toggleFavFilter() {
    showFavOnly = !showFavOnly;
    const btn = document.getElementById('favFilterBtn');
    if(showFavOnly) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
    search();
  }

  function installApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the install prompt');
        }
        deferredPrompt = null;
      });
    } else {
      alert("Untuk menambahkan ke layar utama:\n\n📱 Android (Chrome): Klik ikon titik 3 di pojok kanan atas, lalu pilih 'Tambahkan ke Layar Utama'.\n\n🍎 iPhone (Safari): Klik ikon Share di bawah, lalu pilih 'Add to Home Screen'.");
    }
  }

  function showGuide() {
    alert("✨ PANDUAN KATALOG UTI ✨\n\n1. Ketik spesifik barang yang ingin dicari.\n2. Klik ikon Hati (♡) untuk menyimpan barang favorit.\n3. Klik Shopee/TikTok untuk belanja langsung di aplikasi.");
  }

  window.onload = init;
</script>
</body>
</html>
