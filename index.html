<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

    body {
      margin: 0; padding: 0; 
      background-color: #f1f8e9; /* Pastel Hijau */
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER: Dibuat solid tanpa efek blur agar ringan */
    .sticky-header {
      position: sticky; top: 0; z-index: 1000;
      background: #ffffff;
      padding: 12px;
      border-bottom: 2px solid #e2e8f0;
    }

    .brand-text { font-weight: 800; font-size: 1.4rem; color: #ff0000; }
    .brand-text span { color: #000000; }
    
    .header-top { display: flex; justify-content: space-between; align-items: center; }

    /* Tombol Panduan/Disclaimer sesuai pakem awal */
    .btn-top {
      background: #fff; border: 1.5px solid #6c5ce7;
      color: #6c5ce7; font-size: 9px; font-weight: 700;
      padding: 5px 10px; border-radius: 6px;
    }

    #searchInput {
      border-radius: 8px; padding: 10px 12px; 
      border: 2px solid #ced4da;
      width: 100%; outline: none; font-size: 14px; margin: 10px 0;
      background: #fff;
    }

    #categoryDropdown {
      width: 100%; border-radius: 8px; padding: 8px;
      border: 2px solid #55efc4;
      font-size: 13px; font-weight: 600; color: #334155;
      background: #fff; outline: none;
    }

    .main-wrapper { padding: 12px; }

    /* CARD: Tanpa bayangan/shadow berat, hanya border solid */
    .product-card {
      background: white; border-radius: 12px; padding: 16px;
      margin-bottom: 12px; 
      border: 2px solid #6c5ce7; /* Outline tegas sesuai gambar */
    }
    
    .badge-custom {
      font-size: 10px; padding: 4px 10px; border-radius: 6px;
      text-transform: uppercase; font-weight: 700; color: #fff;
    }
    
    .merk-label { 
      font-size: 10px; color: #b45309; font-weight: 700; 
      background: #fef3c7; padding: 3px 8px; border-radius: 5px;
    }

    .product-name { font-weight: 700; font-size: 14px; margin: 12px 0; color: #1e293b; }

    /* BUTTONS: Tanpa gradasi/efek cahaya agar HP tidak panas */
    .button-group { display: flex; gap: 8px; }
    
    .btn-aff {
      flex: 1; border-radius: 8px; padding: 10px; font-size: 12px;
      font-weight: 700; text-align: center; text-decoration: none !important;
      color: white !important; display: flex; align-items: center; justify-content: center; gap: 5px;
      border: 2px solid #000; /* Outline hitam tegas */
    }
    
    .shopee { background: #ee4d2d; }
    .tiktok { background: #000; }

    /* Warna Kategori Pastel */
    .c-1 { background: #74b9ff; }
    .c-2 { background: #ff7675; }
    .c-3 { background: #55efc4; color: #000 !important; }
    .c-4 { background: #a29bfe; }
    .c-5 { background: #ffeaa7; color: #000 !important; }

  </style>
</head>
<body>

<div class="sticky-header">
  <div class="header-top">
    <div class="brand-text">Katalog<span>UTI</span></div>
    <div class="d-flex gap-2">
      <button class="btn-top" onclick="showDisclaimer()">Disclaimer</button>
      <button class="btn-top" onclick="showGuide()">Panduan</button>
    </div>
  </div>
  <input type="text" id="searchInput" placeholder="Cari barang..." onkeyup="search()">
  <select id="categoryDropdown" onchange="search()">
    <option value="Semua">📂 Semua Kategori</option>
  </select>
</div>

<div class="main-wrapper" id="productList">
  <div class="text-center py-5 text-muted small">Memuat data...</div>
</div>

<script>
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaVyE4Tz42jVQefjYdZZ-Lhn1ApYL9ehbaX2MByWWfM65NPNS2TKugPjoFe-oJTGxylW2hhz-r849y/pub?output=csv';
  let localData = [];

  async function fetchData() {
    try {
      const response = await fetch(SHEET_URL);
      const csv = await response.text();
      const lines = csv.split('\n');
      localData = lines.slice(1).map(line => {
        const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
        return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : [];
      }).filter(r => r.length > 0 && r[0] !== "");
      renderData(localData);
      
      const cats = [...new Set(localData.map(r => r[1]))].filter(c => c);
      const dropdown = document.getElementById('categoryDropdown');
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = opt.text = c;
        dropdown.add(opt);
      });
    } catch (e) {
      document.getElementById('productList').innerHTML = "Gagal memuat.";
    }
  }

  function renderData(data) {
    const list = document.getElementById('productList');
    const cols = ['c-1', 'c-2', 'c-3', 'c-4', 'c-5'];
    list.innerHTML = data.map((row, i) => `
      <div class="product-card">
        <div class="d-flex justify-content-between align-items-center">
          <span class="badge-custom ${cols[i % 5]}">${row[1] || 'Viral'}</span>
          <span class="merk-label">${row[2] || '-'}</span>
        </div>
        <div class="product-name">${row[0]}</div>
        <div class="button-group">
          <a href="${row[3]}" target="_blank" class="btn-aff shopee"><i class="fas fa-shopping-bag"></i> Shopee</a>
          <a href="${row[4]}" target="_blank" class="btn-aff tiktok"><i class="fab fa-tiktok"></i> TikTok</a>
        </div>
      </div>
    `).join('');
  }

  function search() {
    const t = document.getElementById('searchInput').value.toLowerCase();
    const c = document.getElementById('categoryDropdown').value;
    const f = localData.filter(r => (r[0] + (r[2]||"")).toLowerCase().includes(t) && (c==='Semua' || r[1]===c));
    renderData(f);
  }

  function showGuide() {
    alert("✨ PANDUAN KATALOG UTI ✨\n\n1. Ketik spesifik barang yang ingin dicari.\n2. Jika terlalu banyak pilihan, pilih kategori yang diinginkan.\n3. Klik Shopee/TikTok untuk belanja langsung di aplikasi.");
  }

  function showDisclaimer() {
    alert("📢 DISCLAIMER & PERJANJIAN\n\n1. Terima Kasih sudah berbelanja melalui link \"KatalogUTI\".\n2. Link yang kami berikan tidak menjamin kualitas barang yang diterima, tapi setidaknya kami sudah memfilter toko-toko resmi dan terpercaya.\n3. Kami berharap Anda berbelanja dengan bijak dan memastikan chat ke toko terkait pertanyaan atau permintaan.\n4. Kami sebagai affiliate tidak bertanggung jawab atas hal-hal yang terjadi di marketplace.");
  }

  window.onload = fetchData;
</script>
</body>
</html>
