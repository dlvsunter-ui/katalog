<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

    body {
      margin: 0; padding: 0; 
      background-color: #f1f8e9; /* Pastel Hijau Muda */
      font-family: 'Poppins', sans-serif; -webkit-font-smoothing: antialiased;
    }

    .sticky-header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.05);
    }

    /* Judul: Katalog (Merah), UTI (Hitam) */
    .brand-text { font-weight: 800; font-size: 1.4rem; color: #ff0000; }
    .brand-text span { color: #000000; }
    
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-btns { display: flex; gap: 4px; }

    /* Gaya tombol panduan/disclaimer seperti kotak dialog */
    .btn-top {
      background: white; border: 2px solid #6c5ce7; /* Outline Biru/Ungu */
      color: #6c5ce7; font-size: 10px; font-weight: 700;
      padding: 6px 12px; border-radius: 6px; /* Tidak bulat penuh */
      transition: all 0.2s;
    }
    .btn-top:hover { background: #6c5ce7; color: white; }

    #searchInput {
      border-radius: 8px; padding: 10px 12px; 
      border: 2px solid #ced4da;
      width: 100%; outline: none; font-size: 14px; margin: 10px 0;
      background: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .filter-section { display: flex; gap: 8px; align-items: center; }
    
    #categoryDropdown {
      flex: 1; border-radius: 8px; padding: 8px;
      border: 2px solid #55efc4; /* Pastel Hijau Cyan */
      font-size: 13px; font-weight: 600; color: #334155;
      background: #fff; outline: none; cursor: pointer;
    }

    .main-wrapper { padding: 12px; }

    /* Gaya kartu produk kotak ber-outline ala pixel art, tapi tanpa efek blur */
    .product-card {
      background: white; border-radius: 12px; padding: 16px;
      margin-bottom: 12px; 
      border: 2px solid #6c5ce7; /* Outline Biru/Ungu utama */
      position: relative;
    }
    
    /* Warna per kategori di bagian atas kartu */
    .badge-top-line {
      height: 6px; width: 60px; border-radius: 4px; 
      position: absolute; top: -1px; left: 20px;
    }

    .badge-custom {
      font-size: 10px; padding: 5px 12px; border-radius: 8px;
      text-transform: uppercase; font-weight: 700; color: #fff;
    }
    
    .merk-label { 
      font-size: 10px; color: #ffbc47; font-weight: 700; 
      background: rgba(255, 188, 71, 0.1); padding: 3px 10px; border-radius: 8px;
    }

    .product-name { font-weight: 700; font-size: 15px; margin: 15px 0; color: #2d3436; }

    .button-group { display: flex; gap: 10px; }
    
    /* Tombol affiliate berbentuk kotak seperti pop-up */
    .btn-aff {
      flex: 1; border-radius: 8px; padding: 12px; font-size: 12px;
      font-weight: 700; text-align: center; text-decoration: none !important;
      color: white !important; display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 2px solid #000000; /* Outline Hitam tebal */
    }
    
    .shopee { background: #ee4d2d; } /* Orange */
    .tiktok { background: #000; border-color: rgba(255,255,255,0.1); }

    /* Variasi warna kategori pastel */
    .cat-blue { background: #74b9ff; color: #fff; }
    .cat-pink { background: #fab1a0; color: #2d3436 !important; }
    .cat-green { background: #55efc4; color: #2d3436 !important; }
    .cat-orange { background: #ffbc47; color: #2d3436 !important; }
    .cat-purple { background: #a29bfe; color: #fff; }

  </style>
</head>
<body>

<div class="sticky-header">
  <div class="d-flex justify-content-between align-items-center">
    <div class="brand-text">Katalog<span>UTI</span></div>
    <div class="d-flex gap-2">
      <button class="btn-top" onclick="alert('📢 Link belanja aman dan terpercaya.')">Disclaimer</button>
      <button class="btn-top" onclick="alert('✨ Klik barang favoritmu, terus pilih platform belanja!')">Panduan</button>
    </div>
  </div>
  <input type="text" id="searchInput" placeholder="Cari barang atau merk..." onkeyup="search()">
  <select id="categoryDropdown" onchange="search()">
    <option value="Semua">📂 Semua Kategori</option>
  </select>
</div>

<div class="main-wrapper" id="productList">
  <div class="text-center py-5">Memuat Barang...</div>
</div>

<script>
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaVyE4Tz42jVQefjYdZZ-Lhn1ApYL9ehbaX2MByWWfM65NPNS2TKugPjoFe-oJTGxylW2hhz-r849y/pub?output=csv';

  let localData = [];

  async function fetchData() {
    try {
      const response = await fetch(SHEET_URL);
      const csvData = await response.text();
      const lines = csvData.split('\n').map(line => {
        const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
        return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : [];
      });
      
      localData = lines.slice(1).filter(row => row.length > 0 && row[0] !== ""); 
      renderData(localData);
      
      const cats = [...new Set(localData.map(r => r[1]))].filter(c => c);
      const dropdown = document.getElementById('categoryDropdown');
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = opt.text = c;
        dropdown.add(opt);
      });
    } catch (e) {
      document.getElementById('productList').innerHTML = "Gagal memuat data.";
    }
  }

  function renderData(data) {
    const list = document.getElementById('productList');
    if(data.length === 0) {
      list.innerHTML = "<div class='text-center py-5'>Barang tidak ditemukan...</div>";
      return;
    }

    const colors = ['cat-blue', 'cat-pink', 'cat-green', 'cat-orange', 'cat-purple'];

    list.innerHTML = data.map((row, index) => {
      const colorClass = colors[index % colors.length];
      return `
        <div class="product-card">
          <div class="badge-top-line ${colorClass}"></div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge-custom ${colorClass}">${row[1] || 'Viral'}</span>
            <span class="merk-label">${row[2] || 'Original'}</span>
          </div>
          <div class="product-name">${row[0]}
